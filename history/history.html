<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="historyTitle">CutWebImage - History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body class="i18n-loading">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo-icon" src="../icons/icon48.png" alt="CutWebImage">
      <h1 class="brand">CutWebImage</h1>
      <span class="badge" id="countBadge">0</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" id="btnSelectAll" title="Select all" data-i18n-title="historySelectAll">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span data-i18n="historySelectAll">Select all</span>
      </button>
      <button class="btn btn-ghost" id="btnDeselectAll" title="Deselect all" data-i18n-title="historyDeselectAll">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
        <span data-i18n="historyDeselectAll">Deselect all</span>
      </button>
      <div class="divider-v"></div>
      <button class="btn btn-export" id="btnExportSelected" title="Export selected" data-i18n-title="historyExportSelected" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span data-i18n="historyExportSelected">Export selected</span>
      </button>
      <button class="btn btn-danger" id="btnDeleteSelected" title="Delete selected" data-i18n-title="historyDeleteSelected" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
        <span data-i18n="historyDeleteSelected">Delete selected</span>
      </button>
      <button class="btn btn-ghost" id="btnRefresh" title="Refresh list" data-i18n-title="historyRefreshTitle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        <span data-i18n="historyRefresh">Refresh</span>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">📷</div>
      <h2 data-i18n="historyEmptyTitle">No screenshots yet</h2>
      <p data-i18n="historyEmptyHelp">Click the floating button at the top right of a page to capture a screenshot.</p>
    </div>

    <!-- 网格列表 -->
    <div class="grid" id="grid"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span data-i18n="historyLoading">Loading...</span>
    </div>
  </main>

  <!-- 图片预览弹窗 -->
  <div class="modal" id="previewModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="Screenshot preview" data-i18n-aria-label="historyPreview">
      <button class="modal-close" id="modalClose" title="Close preview" aria-label="Close preview" data-i18n-title="historyClosePreview" data-i18n-aria-label="historyClosePreview">&times;</button>
      <img class="modal-img" id="modalImg" src="" alt="Screenshot preview">
      <div class="modal-footer">
        <span class="modal-info" id="modalInfo"></span>
        <div class="modal-actions">
          <button class="btn btn-primary" id="btnCopyImage" data-i18n="historyCopyImage">Copy image</button>
          <button class="btn btn-ghost" id="btnOpenUrl" data-i18n="historyOpenUrl">Open original page</button>
          <button class="btn btn-ghost" id="btnDownload" data-i18n="commonDownload">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../lib/jszip.min.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="history.js"></script>
</body>
</html>
